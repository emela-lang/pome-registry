# 手元のサーバーで動かす。外に向けてポートは開けず、cloudflared が Tunnel を張る。
# Workers VPC Service の宛先は http://ingester:8080 にする。
#
#   INGEST_SECRET=... TUNNEL_TOKEN=... docker compose up -d --build
#
# Komodo の Stack で動かすときは、run directory を packages/ingester にし、
# INGEST_SECRET と TUNNEL_TOKEN を Stack の Environment に Secret から入れる。

services:
  ingester:
    build:
      context: ../..
      dockerfile: packages/ingester/Dockerfile
    environment:
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET}
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    depends_on: [ingester]
    restart: unless-stopped
